[project]
name = "custom-toolbox"
version = "0.1.0"
description = "Plugin-based Python desktop toolbox for local automation workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["toolbox", "desktop", "plugin", "automation", "pyside6", "qt"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PySide6>=6.8,<7.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
custom-toolbox = "toolbox_app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolbox_app = [
    "web/*",
    "assets/icons/*",
    "assets/branding/*",
    "plugins/builtin/*/manifest.json",
]
